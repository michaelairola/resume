rows:
  - title: "Summary"
    data: |
      <div id="professionalSummary">
          Ambitious senior software engineer with 8 years of experience building end-to-end products across the full tech stack.
          Developed web applications, CLI tools, scalable data pipelines, and CI/CD infrastructure for mission-critical systems in the aerospace and healthcare industries.
          Passionate about solving customer problems through high-quality code.
      </div>
  - title: Work
    data: |
      <ul class="xpList">
        <li class="xpItem">
            <div>
                <span class="xpName">
                    Senior Technical Staff at <a target="_blank" href="https://aerospace.org/">The Aerospace Organization</a>
                </span>
                (2022-present):
            </div>
            <div class="xpDescription">
                <ul>
                    <li>
                        Manage the end-to-end lifecycle of web applications that provide data-driven insights to customers in the aerospace field.
                    </li>
                    <li>
                        Leverage industry-standard practices of microservice architectures, CI/CD pipelines, and containerization to ship high-quality features on a regular cadence.
                    </li>
                    <li>
                        Develop a full-stack web application featuring an automated Retrieval-Augmented Generation (RAG) pipeline that ingests diverse user datasets to generate high quality, context-aware embeddings and real-time insights.
                    </li>
                    <li>
                        Engineer satellite communication system simulators that measure system success rates and provide verification/validation testing on third party communication systems.
                    </li>
                    <li>
                        Lead a team of 4 engineers in building a role-based access control system and single-sign-on authentication integration.
                    </li>
                    <li>
                        Translate user-facing requirements into easily actionable tasks for stakeholders and developers to align on timelines and deliverables using JIRA, a project management platform.
                    </li>
                    <li>
                        Partnered with cross-functional teams to launch a centralized internal PyPI index, establishing company-wide standards for python module versioning and facilitating the seamless sharing of resusable code accrosss all internal projects.
                    </li>
                </ul>
            </div>
        </li>
        <li class="xpItem">
            <div>
                <span class="xpName">
                    Business Intelligence Developer at <a target="_blank" href="https://www.aspirehealthplan.org/">Aspire</a>
                </span>
                (2021-2022):
            </div>
            <div class="xpDescription">
                <ul>
                    <li>
                        Developed and maintained an Enterprise Data Warehouse to support all organizational business needs.
                    </li>
                    <li>
                        Used SQL to design and manage relational databases, applying core data modeling principles like normalization and schema design to ensure data integrity and optimize query performance.
                    </li>
                    <li>
                        Gathered client requirements and developed tailored queries using a customer-centric approach.
                    </li>
                    <li>
                        Designed and developed a C++ data-extraction pipeline runner featuring monitoring, validation, and scheduling.
                    </li>
                </ul>
            </div>
        </li>
        <li class="xpItem">
            <div>
                <span class="xpName">
                    Full Stack Engineer at Defie
                </span>
                (2018-2021):
            </div>
            <div class="xpDescription">
                <ul>
                    <li>
                        Built and shipped features for an <a target="_blank" href="https://en.wikipedia.org/wiki/Enterprise_resource_planning">Enterprise Resource Planning (ERP) software</a>.
                    </li>
                    <li>
                        Developed refined user experiences using frontend industry-standard practices such as component-based modules, lifecycle methods, and state management patterns.
                    </li>
                    <li>
                        Streamlined existing CI/CD infrastructure, replacing over 40 different deployment processes into 1 easily maintainable helm chart.
                    </li>
                    <li>
                        Refactored a large-scale legacy GoLang codebase (134k LOC), resulting in a 66% reduction of total lines of code while improving standardization.
                    </li>
                </ul>
            </div>
        </li>
      </ul>
  - title: Personal Projects
    data: |
      <ul class="xpDescription" style="margin-top:0px;margin-bottom:0px;">
          <li>
                Authored and developed Jinja2Static (<a target="_blank" href="https://pypi.org/project/jinja2static/">https://pypi.org/project/jinja2static/</a>), a simple python package for generating static websites from Jinja2 templates.
          </li>
          <li>
              Created an N64 game by developing software with C++, deploying it to a RaspberryPi Zero PCB, and 3D-printing a game cartridge shell using FreeCAD. This was runnable on an original Nintendo 64.
          </li>
          <li>
              Developed a wireless remote for home automation and a wireless sensor system for garden moisture monitoring using ESP8622.
          </li>
      </ul>
